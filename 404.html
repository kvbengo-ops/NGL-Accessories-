<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | NGL Accessories</title>
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .not-found-container {
      max-width: 800px;
      margin: 120px auto 80px;
      padding: 0 24px;
      text-align: center;
      font-family: var(--font-sans);
      color: var(--obsidian);
    }
    .not-found-container h1 {
      font-family: var(--font-serif);
      font-size: 80px;
      margin-bottom: 16px;
      color: var(--gold-300);
    }
    .not-found-container h2 {
      font-size: 24px;
      margin-bottom: 32px;
    }
    .not-found-container p {
      line-height: 1.6;
      margin-bottom: 32px;
      color: #555;
    }
    .not-found-container .btn {
      display: inline-block;
    }
  </style>
</head>
<body>
  <nav class="navbar scrolled">
    <div class="nav-inner">
      <a href="/home.html" class="nav-logo">NGL Accessories</a>
    </div>
  </nav>

  <div class="not-found-container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>We can't seem to find the page you're looking for. It might have been removed or the link might be broken.</p>
    <a href="/home.html" class="btn btn--solid">Return Home</a>
  </div>
</body>
</html>
