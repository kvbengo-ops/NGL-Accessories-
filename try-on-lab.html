<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Try-on lab — NGL</title><link rel="stylesheet" href="/src/style.css"><style>
body{background:#f8f3e7;color:#28231a;font-family:var(--font-sans);padding:24px}.lab{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(280px,640px) minmax(220px,1fr);gap:24px}.lab-view{position:relative;aspect-ratio:3/4;background:#24201c;overflow:hidden}.lab-view video,.lab-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lab-view video{transform:scaleX(-1)}.lab-view canvas{pointer-events:none}.lab-controls{display:grid;align-content:start;gap:15px}.lab-controls label{display:grid;gap:5px}.lab-controls input,.lab-controls select{width:100%}button{padding:10px;border:1px solid var(--gold-500);background:var(--gold-500);color:white;cursor:pointer}@media(max-width:700px){body{padding:10px}.lab{display:block}.lab-view{max-height:55dvh}.lab-controls{margin-top:20px}}
</style></head><body><main class="lab"><div><h1>Try-on lab</h1><p>Neutral tracking shapes for visual calibration. Camera frames stay on this device.</p><div class="lab-view" id="view"><canvas id="overlay"></canvas></div><p id="status" role="status" aria-live="polite">Camera off</p><p id="metrics">FPS: — · Inference: —</p><p id="values" aria-live="off">Adjustments: all 0</p></div><div class="lab-controls"><button id="start">Start camera</button><button id="stop">Stop camera</button><label>Engine<select id="engine"><option value="webar">WebAR.rocks ear model (default)</option><option value="mediapipe">MediaPipe (old baseline)</option></select></label><label><span><input type="checkbox" id="debug" style="width:auto"> Show tracking points</span></label><label>Fixture<select id="fixture"></select></label><label>Left horizontal offset <input type="range" id="left-x" min="-0.25" max="0.25" step="0.01" value="0"></label><label>Left vertical offset <input type="range" id="left-y" min="-0.25" max="0.25" step="0.01" value="0"></label><label>Right horizontal offset <input type="range" id="right-x" min="-0.25" max="0.25" step="0.01" value="0"></label><label>Right vertical offset <input type="range" id="right-y" min="-0.25" max="0.25" step="0.01" value="0"></label><label>Size <input type="range" id="size" min="0.5" max="2" step="0.05" value="1"></label><button id="reset">Reset</button></div></main><script type="module">
import { FIXTURES } from '/src/try-on/fixtures.js';
import { createPreviewSession } from '/src/try-on/controller.js';
const $=id=>document.getElementById(id), select=$('fixture');
for(const fixture of FIXTURES)select.add(new Option(fixture.productId,fixture.productId));
let user;
const seen=new Set();
const preview=createPreviewSession({view:$('view'),canvas:$('overlay'),engine:$('engine').value,onState:state=>{$('status').textContent=state;},onMetrics:(()=>{let frames=0,windowStart=performance.now(),startText='';return ({inferenceMs,mode,startMs})=>{if(startMs!==undefined){startText=` · first result ${(startMs/1000).toFixed(1)} s (${seen.has(mode)?'warm':'cold'})`;seen.add(mode);return}frames++;const now=performance.now();if(now-windowStart>=1000){$('metrics').textContent=`FPS: ${(frames*1000/(now-windowStart)).toFixed(1)} · Inference: ${inferenceMs==null?'n/a':inferenceMs.toFixed(1)+' ms'} · ${mode}${startText}`;frames=0;windowStart=now;}}})()});
function showValues(){const f=n=>Number(n).toFixed(2);$('values').textContent=`Adjustments: L(${f(user.offset.left.x)}, ${f(user.offset.left.y)}) R(${f(user.offset.right.x)}, ${f(user.offset.right.y)}) size ${f(user.scale)}`}
$('debug').addEventListener('change',()=>preview.setDebug($('debug').checked));$('engine').addEventListener('change',()=>{$('metrics').textContent='FPS: — · Inference: —';preview.setEngine($('engine').value)});
function reset(){user={offset:{left:{x:0,y:0},right:{x:0,y:0}},scale:1};for(const id of ['left-x','left-y','right-x','right-y'])$(id).value=0;$('size').value=1;preview.setUser(user);showValues()}
function selectFixture(){preview.setProduct(FIXTURES.find(f=>f.productId===select.value));reset()}
select.addEventListener('change',selectFixture);for(const side of ['left','right'])for(const axis of ['x','y'])$(`${side}-${axis}`).addEventListener('input',e=>{user.offset[side][axis]=Number(e.target.value);preview.setUser(user);showValues()});$('size').addEventListener('input',e=>{user.scale=Number(e.target.value);preview.setUser(user);showValues()});$('reset').addEventListener('click',reset);$('start').addEventListener('click',()=>preview.start());$('stop').addEventListener('click',()=>{preview.stop();$('status').textContent='Camera off'});window.addEventListener('pagehide',()=>preview.stop());selectFixture();
</script></body></html>
