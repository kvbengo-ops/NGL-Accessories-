<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Order — NGL Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="confirm-page">

  <nav class="checkout-nav">
    <a href="/index.html" class="checkout-nav-logo">NGL Accessories</a>
  </nav>

  <div class="confirm-layout">
    <div class="confirm-card">
      <div class="confirm-icon-wrap">
        <div class="confirm-icon" style="background:rgba(201,168,76,0.12)">
          <span class="material-symbols-outlined">local_shipping</span>
        </div>
      </div>
      <span class="confirm-eyebrow">Order Tracking</span>
      <h1 class="confirm-title">Track your order</h1>
      <p class="confirm-subtitle">Enter your order number and the email you used at checkout.</p>

      <!-- Lookup form -->
      <form id="track-form" class="modal-form" style="text-align:left;max-width:420px;margin:24px auto 0;">
        <div class="form-field">
          <label class="form-label" for="track-number">Order Number</label>
          <input type="text" id="track-number" class="form-input" placeholder="NGL-20260609-1234" required />
        </div>
        <div class="form-field">
          <label class="form-label" for="track-email">Email Address</label>
          <input type="email" id="track-email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-error" id="track-error" role="alert" style="display:none;"></div>
        <button type="submit" class="btn-checkout-primary" id="track-submit" style="width:100%;justify-content:center;margin-top:8px;">
          <span class="material-symbols-outlined">search</span>
          Track Order
        </button>
      </form>

      <!-- Result -->
      <div id="track-result" class="hidden">
        <div class="confirm-order-box">
          <div class="confirm-order-num">
            <span class="material-symbols-outlined">receipt_long</span>
            <span id="track-order-number">—</span>
          </div>
          <div id="track-order-details"></div>
        </div>

        <div class="confirm-timeline" id="track-timeline"></div>

        <div class="confirm-actions">
          <a href="/shop.html" class="btn-checkout-primary">
            <span class="material-symbols-outlined">storefront</span>
            Continue Shopping
          </a>
          <button type="button" class="btn-checkout-ghost" id="track-again">Track another order</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/track-order.js"></script>
</body>
</html>
