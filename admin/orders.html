<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — NGL Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>try{if(localStorage.getItem('ngl_admin_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
</head>
<body class="admin-page">
  <div id="sidebar-container"></div>

  <main class="admin-main">
    <header class="admin-header">
      <div>
        <h1 class="admin-page-title">Orders</h1>
        <p class="admin-page-subtitle">All online and POS orders</p>
      </div>
      <button class="admin-header-btn" id="btn-export-csv">
        <span class="material-symbols-outlined">download</span>
        Export CSV
      </button>
    </header>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="orders-search" class="admin-search" placeholder="Search order # or customer…" />
      </div>
      <select id="orders-filter-type" class="admin-select">
        <option value="">All Types</option>
        <option value="online">Online</option>
        <option value="pos">POS</option>
      </select>
      <select id="orders-filter-status" class="admin-select">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="voided">Voided</option>
      </select>
    </div>

    <!-- Table -->
    <section class="admin-card">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Type</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="8" class="table-loading">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Order Detail Panel -->
  <div class="admin-modal-backdrop" id="order-detail-modal">
    <div class="admin-modal admin-modal--wide">
      <div class="modal-header">
        <h2 class="modal-title" id="order-detail-number">Order Details</h2>
        <button class="modal-close-btn" id="close-order-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="order-detail-content" id="order-detail-content"></div>
    </div>
  </div>

  <script type="module" src="/src/orders.js"></script>
</body>
</html>
