<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — NGL Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/orders.css" />
  <script>try{var d=document.documentElement.dataset;d.theme=localStorage.getItem('ngl_admin_theme')||'dark';d.mode=localStorage.getItem('ngl_admin_mode')||'dark'}catch(e){}</script>
</head>
<body class="admin-page orders-page">
  <div id="sidebar-container"></div>

  <main class="admin-main">
    <header class="admin-header">
      <div>
        <h1 class="admin-page-title">Orders</h1>
        <p class="admin-page-subtitle">All online and POS orders</p>
      </div>
      <button class="btn-admin-ghost" id="btn-export-csv">
        <span class="material-symbols-outlined">download</span>
        Export CSV
      </button>
    </header>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="search-wrap">
        <label for="orders-search">Find an order</label>
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="orders-search" class="admin-search" placeholder="Search order # or customer…" />
      </div>
      <label class="orders-filter">Sales channel<select id="orders-filter-type" class="admin-select">
        <option value="">All Types</option>
        <option value="online">Online</option>
        <option value="pos">POS</option>
      </select></label>
      <label class="orders-filter">Order status<select id="orders-filter-status" class="admin-select">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="voided">Voided</option>
      </select></label>
      <button id="orders-clear" class="btn-admin-ghost" type="button">Clear filters</button>
    </div>

    <!-- Table -->
    <section class="orders-ledger" aria-label="Order list">
      <div class="orders-list-heading"><p id="orders-count" aria-live="polite">Loading orders…</p><span>Newest first</span></div>
      <div class="table-wrap">
        <table class="orders-table">
          <thead>
            <tr>
              <th scope="col">Customer / order</th>
              <th scope="col">Status</th>
              <th scope="col">Amount</th>
              <th scope="col"><span class="orders-action-heading">Details</span></th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="4" class="table-loading">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Order Detail Panel -->
  <div class="admin-modal-backdrop" id="order-detail-modal">
    <div class="admin-modal admin-modal--wide">
      <div class="modal-header">
        <h2 class="modal-title" id="order-detail-number">Order Details</h2>
        <button class="modal-close-btn" id="close-order-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="order-detail-content" id="order-detail-content"></div>
    </div>
  </div>

  <script type="module" src="/src/orders.js"></script>
</body>
</html>
