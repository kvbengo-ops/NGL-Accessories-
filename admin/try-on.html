<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Try-on editor — NGL Admin</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/inventory.css"><link rel="stylesheet" href="/src/try-on/try-on.css"><style>
.try-editor{max-width:1250px;margin:auto;padding:28px}.try-editor h1{font-family:var(--font-serif);font-size:44px}.try-editor-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);gap:25px}.try-editor-card{background:#fffdf7;color:#29241b;border:1px solid #e5dcc8;padding:22px}.try-editor-card h2{font-family:var(--font-serif);font-size:30px}.try-editor-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.try-editor-fields label{display:grid;gap:5px;font-size:12px}.try-editor-fields [hidden]{display:none!important}.try-editor-fields input{width:100%;padding:8px}.try-editor-fields input[type=range]{padding:0;accent-color:var(--gold-500)}.try-editor-fields .full{grid-column:1/-1}.try-editor-preview{position:relative;background:#252019;aspect-ratio:3/4;max-height:600px;overflow:hidden}.try-editor-preview video,.try-editor-preview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.try-editor-preview video{transform:scaleX(-1)}.try-editor-preview canvas{pointer-events:none}.try-editor-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.try-editor-actions button{padding:10px 16px;cursor:pointer}.try-editor-image{display:block;position:relative;width:min(100%,240px);height:200px;background:repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 50%/20px 20px;margin:8px 0;cursor:crosshair}.try-editor-image img{width:100%;height:100%;object-fit:contain}.try-editor-image::after{content:'';position:absolute;left:calc(var(--ax,50%) - 5px);top:calc(var(--ay,50%) - 5px);width:10px;height:10px;border:2px solid red;border-radius:50%;pointer-events:none}.try-editor-error{color:#a22222;font-size:11px;min-height:1em}.try-editor-status{min-height:1.5em}.try-editor-crop{justify-self:start;padding:6px 12px;cursor:pointer}.crop-dialog{width:min(560px,94vw);border:1px solid #e5dcc8;padding:20px;background:#fffdf7;color:#29241b}.crop-dialog::backdrop{background:rgba(20,18,13,.6)}.crop-dialog h2{font-family:var(--font-serif);font-size:28px;margin:0 0 12px}.crop-wrap{text-align:center}.crop-stage{position:relative;display:inline-block;overflow:hidden;background:repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 50%/20px 20px}.crop-stage img{display:block;max-width:100%;max-height:45vh}#crop-box{position:absolute;inset:0;border:2px solid var(--gold-500);box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}.crop-sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.crop-sliders label{display:grid;gap:4px;font-size:12px}.crop-sliders input{width:100%;accent-color:var(--gold-500)}@media(max-width:760px){.try-editor-grid{display:block}.try-editor-card{margin-bottom:18px}}
</style></head><body class="admin-page"><div id="sidebar-container"></div><main class="admin-main"><div class="try-editor"><p><a href="/admin/inventory.html">← Inventory</a></p><h1>Try-on editor</h1><p id="product-name">Loading product…</p><div class="try-editor-grid"><section class="try-editor-card"><h2>Artwork & placement</h2><div class="try-editor-fields"><label class="full">Left transparent image<input type="file" id="left-file" accept="image/png,image/webp"><span class="try-editor-error" data-error="assets.left"></span></label><button type="button" class="try-editor-image" id="left-anchor" aria-label="Set left attachment point"><img alt="Left earring asset"></button><button type="button" class="try-editor-crop" data-crop="left">Crop left image</button><label class="full"><input type="checkbox" id="mirror" checked> Mirror left image for right ear</label><label class="full" id="right-file-wrap" hidden>Right transparent image<input type="file" id="right-file" accept="image/png,image/webp"><span class="try-editor-error" data-error="assets.right"></span></label><button type="button" class="try-editor-image" id="right-anchor" aria-label="Set right attachment point" hidden><img alt="Right earring asset"></button><button type="button" class="try-editor-crop" data-crop="right" hidden>Crop right image</button><label>Scale ratio<input type="range" id="scale" min="0.02" max="1" step="0.01" value="0.18"><output id="scale-value">0.18</output><span class="try-editor-error" data-error="scaleRatio"></span></label><label>Length (mm, optional)<input type="number" id="length" min="0" max="500" step="0.1"><span class="try-editor-error" data-error="lengthMm"></span></label><label>Left X offset<input type="range" id="left-x" min="-0.5" max="0.5" step="0.01" value="0"><output id="left-x-value">0</output><span class="try-editor-error" data-error="offset.left.x"></span></label><label>Left Y offset<input type="range" id="left-y" min="-0.5" max="0.5" step="0.01" value="0"><output id="left-y-value">0</output><span class="try-editor-error" data-error="offset.left.y"></span></label><label>Right X offset<input type="range" id="right-x" min="-0.5" max="0.5" step="0.01" value="0"><output id="right-x-value">0</output><span class="try-editor-error" data-error="offset.right.x"></span></label><label>Right Y offset<input type="range" id="right-y" min="-0.5" max="0.5" step="0.01" value="0"><output id="right-y-value">0</output><span class="try-editor-error" data-error="offset.right.y"></span></label><label>Left rotation<input type="range" id="left-rot" min="-45" max="45" step="1" value="0"><output id="left-rot-value">0</output><span class="try-editor-error" data-error="rotationDeg.left"></span></label><label>Right rotation<input type="range" id="right-rot" min="-45" max="45" step="1" value="0"><output id="right-rot-value">0</output><span class="try-editor-error" data-error="rotationDeg.right"></span></label></div><div class="try-editor-actions"><button id="save-draft">Save draft</button><button id="publish">Publish</button><button id="disable">Disable</button></div><p class="try-editor-status" id="save-status" role="status"></p></section><section class="try-editor-card"><h2>Live preview</h2><p>Camera images stay on this device. Start camera to review placement before publishing.</p><div class="try-editor-preview" id="preview"><canvas id="preview-canvas"></canvas></div><p id="preview-status" role="status">Camera off</p><div class="try-editor-actions"><button id="preview-start">Start camera</button><button id="preview-stop">Stop camera</button></div></section></div></div></main><dialog id="crop-dialog" class="crop-dialog" aria-labelledby="crop-title"><h2 id="crop-title">Crop image</h2><p>Trim the empty space around the earring. Its size on the face and the attachment point are kept.</p><div class="crop-wrap"><div class="crop-stage" id="crop-stage"><div id="crop-box"></div></div></div><div class="crop-sliders"><label>Trim left<input type="range" id="crop-l" min="0" max="95" step="0.5" value="0"><output id="crop-l-value">0%</output></label><label>Trim right<input type="range" id="crop-r" min="0" max="95" step="0.5" value="0"><output id="crop-r-value">0%</output></label><label>Trim top<input type="range" id="crop-t" min="0" max="95" step="0.5" value="0"><output id="crop-t-value">0%</output></label><label>Trim bottom<input type="range" id="crop-b" min="0" max="95" step="0.5" value="0"><output id="crop-b-value">0%</output></label></div><p class="try-editor-error" id="crop-error" role="alert"></p><div class="try-editor-actions"><button type="button" id="crop-auto">Auto-trim transparent edges</button><button type="button" id="crop-apply">Apply crop</button><button type="button" id="crop-cancel">Cancel</button></div></dialog><script type="module" src="/src/try-on-admin.js"></script></body></html>
