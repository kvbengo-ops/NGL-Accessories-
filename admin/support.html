<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat — NGL Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="admin-page">
  <div id="sidebar-container"></div>
  
  <main class="admin-main">
    <div class="admin-header">
      <div class="admin-header-title">
        <h1>Live Chat</h1>
        <p>Support your customers in real time.</p>
      </div>
    </div>

    <div class="admin-content">
      <div class="support-admin-layout">
        <!-- Left Pane: Queue -->
        <div class="support-queue" id="support-queue">
          <div class="support-queue-header">
            <h3>Active Conversations</h3>
          </div>
          <div class="support-queue-list" id="support-queue-list">
            <!-- Queue items populate here -->
            <div class="support-empty-state">Loading chats...</div>
          </div>
        </div>

        <!-- Right Pane: Thread View -->
        <div class="support-thread" id="support-thread">
          <div class="support-empty-state" id="support-thread-empty">
            <span class="material-symbols-outlined">forum</span>
            <p>Select a conversation to view.</p>
          </div>
          
          <div class="support-thread-content hidden" id="support-thread-content">
            <div class="support-thread-header">
              <div class="support-thread-info">
                <h3 id="support-thread-name">Customer</h3>
                <span class="status-badge" id="support-thread-status">Status</span>
              </div>
              <div class="support-thread-actions">
                <button class="btn-outline" id="btn-takeover">Take Over</button>
                <button class="btn-primary" id="btn-resolve">Resolve</button>
              </div>
            </div>
            
            <div class="support-thread-messages" id="support-thread-messages" role="log" aria-live="polite">
              <!-- Thread messages -->
            </div>
            
            <div class="support-thread-input">
              <textarea id="support-admin-input" placeholder="Type your reply..." rows="1" disabled></textarea>
              <button id="support-admin-send" class="btn-primary" disabled>
                <span class="material-symbols-outlined">send</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module" src="/src/support-admin.js"></script>
</body>
</html>
