<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat — NGL Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/support-admin.css">
  <script>try{var d=document.documentElement.dataset;d.theme=localStorage.getItem('ngl_admin_theme')||'dark';d.mode=localStorage.getItem('ngl_admin_mode')||'dark'}catch(e){}</script>
</head>
<body class="admin-page live-chat-page">
  <div id="sidebar-container"></div>
  
  <main class="admin-main">
    <div class="admin-header">
      <div class="admin-header-title">
        <h1 class="admin-page-title">Live Chat</h1>
        <p class="admin-page-subtitle">Customer conversations, all in one inbox.</p>
      </div>
    </div>

    <div class="admin-content">
      <div class="support-admin-layout">
        <!-- Left Pane: Queue -->
        <div class="support-queue" id="support-queue">
          <div class="support-queue-header">
            <div class="chat-inbox-heading"><h2>Inbox</h2><span id="chat-queue-count" aria-live="polite"></span><button type="button" id="chat-refresh" class="btn-admin-ghost" aria-label="Refresh conversations">Refresh</button></div>
            <label class="chat-field" for="chat-search">Search conversations</label>
            <input type="search" id="chat-search" placeholder="Name, email or message" class="admin-search">
            <label class="chat-field" for="chat-filter">Show</label>
            <select id="chat-filter" class="admin-select"><option value="open">Open conversations</option><option value="needs_human">Needs a reply</option><option value="mine">Assigned to me</option><option value="resolved">Resolved</option><option value="all">All conversations</option></select>
          </div>
          <div class="support-queue-list" id="support-queue-list">
            <!-- Queue items populate here -->
            <div class="support-empty-state">Loading chats...</div>
          </div>
        </div>

        <!-- Right Pane: Thread View -->
        <div class="support-thread" id="support-thread">
          <div class="support-empty-state" id="support-thread-empty">
            <span class="material-symbols-outlined">forum</span>
            <h2>Your customer inbox</h2><p>Choose a conversation to read its history and reply. Chats needing a person appear first.</p>
          </div>
          
          <div class="support-thread-content hidden" id="support-thread-content">
            <div class="support-thread-header">
              <button type="button" id="chat-back" class="btn-admin-ghost" aria-label="Back to inbox">← Inbox</button>
              <div class="support-thread-info">
                <h3 id="support-thread-name">Customer</h3>
                <p id="support-thread-email"></p>
                <span class="status-badge" id="support-thread-status">Status</span>
              </div>
              <div class="support-thread-actions">
                <button class="btn-admin-ghost" id="btn-takeover">Assign to me</button>
                <button class="btn-admin-primary" id="btn-resolve">Mark resolved</button>
              </div>
            </div>
            
            <div class="support-thread-messages" id="support-thread-messages" role="log" aria-live="polite">
              <!-- Thread messages -->
            </div>
            
            <div class="chat-composer">
            <p id="chat-reply-hint" role="status"></p>
            <div class="support-thread-input">
              <textarea id="support-admin-input" aria-label="Reply to customer" aria-describedby="chat-reply-hint" placeholder="Write a reply…" rows="2" disabled></textarea>
              <button id="support-admin-send" class="btn-admin-primary" disabled>
                <span>Send</span><span class="material-symbols-outlined" aria-hidden="true">send</span>
              </button>
            </div>
            <small class="chat-keyboard-hint">Enter to send · Shift + Enter for a new line</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module" src="/src/support-admin.js"></script>
</body>
</html>
