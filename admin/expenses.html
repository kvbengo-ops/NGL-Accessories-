<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses — NGL Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>try{var d=document.documentElement.dataset;d.theme=localStorage.getItem('ngl_admin_theme')||'dark';d.mode=localStorage.getItem('ngl_admin_mode')||'dark'}catch(e){}</script>
</head>
<body class="admin-page">
  <div id="sidebar-container"></div>

  <main class="admin-main">
    <header class="admin-header">
      <div>
        <h1 class="admin-page-title">Expenses Ledger</h1>
        <p class="admin-page-subtitle">Track your business expenses to calculate true Net Profit.</p>
      </div>
      <div style="display:flex;gap:12px;">
        <button class="btn-admin-ghost" id="btn-export-expenses">
          <span class="material-symbols-outlined">download</span>
          Export CSV
        </button>
        <button class="btn-admin-primary" id="btn-create-expense">
          <span class="material-symbols-outlined">add</span>
          Log Expense
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="expenses-search" class="admin-search" placeholder="Search expenses…" />
      </div>
      <select id="expenses-filter-category" class="admin-select">
        <option value="">All Categories</option>
        <option value="Ads & Marketing">Ads & Marketing</option>
        <option value="Packaging Supplies">Packaging Supplies</option>
        <option value="Shipping/Logistics">Shipping/Logistics</option>
        <option value="Software & Hosting">Software & Hosting</option>
        <option value="Operations/Other">Operations/Other</option>
      </select>
      <select id="expenses-filter-month" class="admin-select">
        <!-- Populated dynamically -->
        <option value="">All Time</option>
      </select>
    </div>

    <!-- Table -->
    <section class="admin-card">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Logged By</th>
              <th style="width:80px; text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="expenses-body">
            <tr><td colspan="6" class="table-loading">Loading expenses…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Expense Modal -->
  <div class="admin-modal-backdrop" id="expense-modal">
    <div class="admin-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="expense-modal-title">Log Expense</h2>
        <button class="modal-close-btn" id="close-expense-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="expense-form" class="modal-form">
        <input type="hidden" id="expense-id" />
        <div class="form-field">
          <label class="form-label" for="expense-title">Description *</label>
          <input type="text" id="expense-title" class="form-input" placeholder="e.g. Facebook Ads, Bubble Mailers" required />
        </div>
        <div class="form-grid-2">
          <div class="form-field">
            <label class="form-label" for="expense-category">Category *</label>
            <select id="expense-category" class="admin-select" required>
              <option value="">Select Category...</option>
              <option value="Ads & Marketing">Ads & Marketing</option>
              <option value="Packaging Supplies">Packaging Supplies</option>
              <option value="Shipping/Logistics">Shipping/Logistics</option>
              <option value="Software & Hosting">Software & Hosting</option>
              <option value="Operations/Other">Operations/Other</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label" for="expense-amount">Amount (₱) *</label>
            <input type="number" id="expense-amount" class="form-input" min="0" step="0.01" required />
          </div>
        </div>
        <div class="form-field">
          <label class="form-label" for="expense-date">Date Incurred *</label>
          <input type="date" id="expense-date" class="form-input" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-admin-ghost" id="btn-cancel-expense">Cancel</button>
          <button type="submit" class="btn-admin-primary" id="btn-save-expense">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/expenses.js"></script>
</body>
</html>
