<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — NGL Accessories</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="apple-touch-icon" href="/favicon-192x192.png" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>try{var d=document.documentElement.dataset;d.theme=localStorage.getItem('ngl_admin_theme')||'dark';d.mode=localStorage.getItem('ngl_admin_mode')||'dark'}catch(e){}</script>
</head>
<body class="admin-login-page">

  <div class="login-bg">
    <div class="login-orb login-orb--1"></div>
    <div class="login-orb login-orb--2"></div>
    <div class="login-grain"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">
          <span class="material-symbols-outlined">diamond</span>
        </div>
        <span class="login-logo">NGL</span>
        <span class="login-subbrand">Admin Portal</span>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to manage your store</p>

      <form class="login-form" id="login-form" novalidate>
        <div class="login-field">
          <label class="login-label" for="login-email">Email address</label>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined login-input-icon">mail</span>
            <input type="email" id="login-email" class="login-input" placeholder="admin@ngl.com" autocomplete="email" required />
          </div>
        </div>

        <div class="login-field">
          <label class="login-label" for="login-password">Password</label>
          <div class="login-input-wrap">
            <span class="material-symbols-outlined login-input-icon">lock</span>
            <input type="password" id="login-password" class="login-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="login-eye" id="login-eye" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined" id="eye-icon">visibility</span>
            </button>
          </div>
        </div>

        <div class="login-error hidden" id="login-error" role="alert">
          <span class="material-symbols-outlined">error</span>
          <span id="login-error-msg">Invalid credentials</span>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <span id="login-btn-text">Sign In</span>
          <span class="login-spinner hidden" id="login-spinner"></span>
          <span class="material-symbols-outlined" id="login-arrow">arrow_forward</span>
        </button>
      </form>

      <p class="login-back">
        <a href="/home.html" class="login-back-link">
          <span class="material-symbols-outlined">arrow_back</span> Back to store
        </a>
      </p>
    </div>
  </div>

  <script type="module" src="/src/admin-login.js"></script>
</body>
</html>
